<div class="panel" [class.empty]="!item()">
  <ng-container *ngIf="item(); else emptyState">
    <header class="header">
      <div class="dot" aria-hidden="true"></div>
      <h2 class="title">{{ item()!.question }}</h2>
    </header>
    <article class="content" aria-live="polite">
      <p>{{ item()!.answer }}</p>

      <!-- Render sources/citations if provided by backend -->
      <section *ngIf="item()!.sources?.length">
        <h3 class="muted" style="margin: 14px 0 8px;">Sources</h3>
        <ul style="padding-left: 1rem;">
          <li *ngFor="let s of item()!.sources">
            <div>
              <a *ngIf="s.url; else plainTitle" [href]="s.url" target="_blank" rel="noopener noreferrer">
                {{ s.title || s.url }}
              </a>
              <ng-template #plainTitle>
                <span>{{ s.title || 'Source' }}</span>
              </ng-template>
            </div>
            <div class="muted" *ngIf="s.snippet" style="font-size: 0.9rem;">
              {{ s.snippet }}
            </div>
          </li>
        </ul>
      </section>
    </article>
  </ng-container>

  <ng-template #emptyState>
    <div class="placeholder">
      <div class="ghost-dot" aria-hidden="true"></div>
      <div>
        <h3>Select a question</h3>
        <p class="muted">Choose a question from the left to view its AI-generated answer here.</p>
      </div>
    </div>
  </ng-template>
</div>
